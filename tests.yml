name: Python 3.12 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements.txt, requirements-py312.lock]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-py312.lock

      - name: Install dependencies through the selected entry point
        run: python -m pip install -r ${{ matrix.requirements }}

      - name: Check dependencies
        run: python -m pip check

      - name: Check imports and syntax
        run: |
          python -m compileall -q app.py metrics.py validation.py exporting.py tests
          python -c "import app, metrics, validation, exporting; print('imports: ok')"

      - name: Run tests
        run: python -m pytest -q
